# Clave única del proyecto en Sonar
sonar.projectKey=FMAT-Restaurant_Menu-Backend

sonar.organization=fmat-restaurant
sonar.host.url=https://sonarcloud.io

# Nombre descriptivo
sonar.projectName=Menu-Backend
sonar.projectVersion=0.0.1-SNAPSHOT

# Rutas de código fuente y pruebas
sonar.sources=src/main/java
sonar.tests=src/test/java

# Configuración de Java, compilados y reportes (generados por Gradle)
sonar.java.source=25
sonar.java.binaries=build/classes/java/main
sonar.java.test.binaries=build/classes/java/test
sonar.java.libraries=build/sonar/libraries/main/*.jar
sonar.java.test.libraries=build/sonar/libraries/test/*.jar
sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml
sonar.junit.reportPaths=build/test-results/test
sonar.java.checkstyle.reportPaths=build/reports/checkstyle/main.xml
sonar.sourceEncoding=UTF-8
sonar.qualitygate.wait=true
