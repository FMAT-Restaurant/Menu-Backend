spring.application.name=menu-backend
server.mime-mappings.yaml=application/yaml
# Imágenes de hasta 10 MiB (Image.MAX_BYTES); el margen de la solicitud cubre el resto del multipart.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
# Las respuestas leen las categorías (carga diferida) después del servicio; se declara explícito para que no se desactive sin notarlo.
spring.jpa.open-in-view=true
# Carga en lotes las relaciones diferidas (entrada y slots de cada oferta en las listas) en lugar de una consulta por fila.
spring.jpa.properties.hibernate.default_batch_fetch_size=50
