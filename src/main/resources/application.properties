spring.application.name=menu-backend
# Orígenes HTTP(S) exactos separados por comas; localhost se controla por separado.
menu.cors.allowed-origins=${MENU_CORS_ALLOWED_ORIGINS:}
menu.cors.allow-localhost=${MENU_CORS_ALLOW_LOCALHOST:true}
# Imágenes de hasta 10 MiB (Image.MAX_BYTES); el margen de la solicitud cubre el resto del multipart.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
# Las respuestas leen las categorías (carga diferida) después del servicio; se declara explícito para que no se desactive sin notarlo.
spring.jpa.open-in-view=true
# Carga en lotes las relaciones diferidas (entrada y slots de cada oferta en las listas) en lugar de una consulta por fila.
spring.jpa.properties.hibernate.default_batch_fetch_size=50
# Servicio externo de Inventario: Menu comprueba los artículos y su unidad antes de guardar opciones.
# base-url es la raíz del servicio: se consulta GET {base-url}/items/{id}.
menu.inventory.base-url=${INVENTORY_BASE_URL:http://localhost:8081}
menu.inventory.token=${INVENTORY_TOKEN:}
menu.inventory.timeout=${INVENTORY_TIMEOUT:3s}

# RabbitMQ: Menu publica sus fuentes (recetas y opciones de Inventario) en menu.topic con las routing keys
# menu.source.created|updated|deleted, y escucha en su cola de disponibilidad lo que Inventario publica en
# inventory.topic. La conexión se define fuera de este archivo con la URL spring.rabbitmq.addresses
# (SPRING_RABBITMQ_ADDRESSES), por ejemplo amqp://usuario:clave@host:5672/vhost.
# Routing key con la que la cola de disponibilidad se enlaza a inventory.topic.
menu.rabbitmq.inventory.availability-routing-key=${INVENTORY_AVAILABILITY_ROUTING_KEY:inventory.recipe.availability-changed}

# Errores de RabbitMQ: fallar rapido, reintentar los cortes breves y no perder nada en silencio.
# Publicacion: el broker confirma cada mensaje (ack/nack) y devuelve los que ninguna cola recibe; ver SourceEventRabbitPublisher.
spring.rabbitmq.connection-timeout=5s
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.max-retries=2
spring.rabbitmq.template.retry.initial-interval=1s
spring.rabbitmq.template.retry.multiplier=2
spring.rabbitmq.template.retry.max-interval=5s
# Consumo: tres intentos y, si fallan, el mensaje va a la DLQ con la excepcion (MessageRecoverer de RabbitMqConfig); nunca se reencola.
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=2
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=5s
