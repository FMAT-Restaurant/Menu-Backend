        course:
          type:
            - string
            - 'null'
          enum:
            - entrada
            - plato fuerte
            - postre
            - bebida
            - null
        options:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SlotOptionPatchInput'
      allOf:
        - if:
            not:
              properties:
                slotId: {}
                name: {}
                quantity: {}
                course: {}
                options: {}
              required:
                - slotId
          then:
            properties:
              name: {}
              quantity: {}
              options: {}
              slotId: {}
              course: {}
            required:
              - name
              - quantity
              - options
