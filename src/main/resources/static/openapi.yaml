  /media/images:
    post:
      tags:
        - Imágenes
      operationId: uploadMenuImage
      summary: Subir una imagen
      description: 'Sube el archivo del campo file mediante multipart/form-data. Acepta JPEG, PNG y WebP de hasta 10 MiB (10485760 bytes), con ancho y alto máximos de 4096 px cada uno. Valida el contenido real y su decodificación, además del tipo declarado. Solo tras validar la carga, el servidor genera el UUID y devuelve data.id, data.url y data.thumbnailUrl. El cliente utiliza data.id como imageId en las solicitudes JSON de creación o edición de entradas y ofertas, sin reenviar el archivo. La carga y la asociación son operaciones separadas: cargar una imagen no crea una entrada ni una oferta. Una imagen inválida devuelve 422 sin crear una imagen utilizable ni modificar un recurso existente o su revisión. Requiere Idempotency-Key con un UUID generado por el cliente para la carga lógica, delimitado por el sujeto autenticado, el menú, el método POST y la ruta concreta. Durante 24 horas desde la confirmación inicial exitosa, reenviar la misma clave, los mismos bytes del archivo y el mismo tipo de medio declarado en la parte file devuelve el 201, cuerpo y ETag originales, incluidos data.id, data.url y data.thumbnailUrl, sin crear otra imagen ni repetir sus efectos de transformación. La comparación ignora el boundary, el orden de las partes y el nombre del archivo; no compara el multipart completo ni deduplica cargas con claves distintas. Una clave nueva permite una carga independiente aunque el archivo sea idéntico. Cada intento verifica autenticación y autorización antes de recuperar el resultado original y antes de volver a validar la imagen vigente. Un encabezado ausente o inválido devuelve 400 INVALID_IDEMPOTENCY_KEY; cambiar el archivo o su tipo de medio con la misma clave devuelve 409 IDEMPOTENCY_KEY_REUSED. Una carga en proceso o interrumpida cuyo resultado todavía sea incierto devuelve 409 IDEMPOTENCY_IN_PROGRESS con Retry-After hasta confirmar su resultado. El reintento recupera o continúa la misma carga lógica y no crea otra imagen utilizable para esa clave. Un fallo confirmado antes de obtener una imagen utilizable permite reintentar la misma clave y archivo; un resultado incierto no inicia otra operación. Los reintentos no extienden las 24 horas; una clave expirada puede tratarse como nueva y crear otra imagen. La asociación posterior con una entrada u oferta sigue siendo independiente y utiliza su propia clave de operación.'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Archivo JPEG, PNG o WebP de hasta 10 MiB (10485760 bytes), con ancho y alto máximos de 4096 px cada uno. Su contenido real debe ser válido y decodificable, además de coincidir con el tipo declarado.
            encoding:
              file:
                contentType: image/jpeg, image/png, image/webp
            examples:
              archivoDeMenu:
                summary: Archivo de imagen seleccionado para cargar
                value:
                  file: hamburguesa-hawaiana.jpg
      responses:
        '201':
          description: Imagen validada, con UUID y URL disponibles, o reproducción del 201, cuerpo y ETag originales de la misma carga idempotente.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageUploadResponse'
              examples:
                imagenCargada:
                  summary: Imagen validada con identificador generado por el servidor
                  value:
                    data:
                      id: 55e62412-9249-4db6-8ccb-31f19ea2f501
                      url: https://cdn.example.com/menu/hamburguesa-hawaiana.jpg
                      thumbnailUrl: https://cdn.example.com/menu/hamburguesa-hawaiana-thumb.jpg
        '400':
          $ref: '#/components/responses/IdempotencyBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token de acceso indicado en api.md.
  schemas:
    PageMeta:
      type: object
      description: Metadatos que indican qué página se devolvió y el tamaño y total de la colección paginada.
      required:
        - page
        - pageSize
        - total
        - totalPages
      properties:
        page:
          type: integer
          minimum: 1
          description: Número de la página devuelta, empezando en 1.
          example: 1
        pageSize:
          type: integer
          minimum: 1
          description: Cantidad solicitada de elementos por página; admite cualquier entero positivo.
          example: 12
        total:
          type: integer
          minimum: 0
          description: Cantidad total de elementos que coinciden con la consulta.
          example: 0
        totalPages:
          type: integer
          minimum: 0
          description: Cantidad total de páginas para el tamaño solicitado.
          example: 0
      example:
        page: 2
        pageSize: 20
        total: 51
        totalPages: 3
    Image:
      type: object
      description: Imagen de catálogo y sus URL de visualización.
      required:
        - id
        - url
        - thumbnailUrl
      properties:
        id:
          type: string
          format: uuid
          description: Identificador UUID de la imagen.
          example: 6b78d901-2c3a-4f5b-8d6e-7a9b0c1d2e3f
        url:
          type: string
          format: uri
          description: URL de la imagen original.
          example: https://cdn.example.com/menu/burger.jpg
        thumbnailUrl:
          type: string
          format: uri
          description: URL de la miniatura de la imagen.
          example: https://cdn.example.com/menu/burger-thumbnail.jpg
      example:
        id: 6b78d901-2c3a-4f5b-8d6e-7a9b0c1d2e3f
        url: https://cdn.example.com/menu/burger.jpg
        thumbnailUrl: https://cdn.example.com/menu/burger-thumbnail.jpg
    InventoryItem:
      type: object
      description: Insumo de inventario referenciado por una receta u opción de una composición.
      required:
        - id
        - name
        - unit
      properties:
        id:
          type: string
          description: Identificador opaco del insumo como string, sin formato UUID requerido.
          example: CARNE-150G
        name:
          type: string
          description: Nombre legible del insumo.
          example: Carne Molida Res 80/20
        unit:
          type: string
          description: Unidad usada para expresar la cantidad del insumo.
          example: g
      example:
        id: CARNE-150G
        name: Carne Molida Res 80/20
        unit: g
    Error:
      type: object
      description: Datos del error devuelto por la API.
      required:
        - message
      properties:
        message:
          type: string
          description: Explicación del error para quien consume la API.
        details:
          type: object
          description: Datos adicionales opcionales y específicos de la respuesta de error.
          additionalProperties: true
    ErrorEnvelope:
      type: object
      description: Envoltura estándar de una respuesta de error.
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/Error'
    ValidationErrorEnvelope:
      type: object
      description: Envoltura estándar que contiene un error de validación.
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ValidationError'
      example:
        error:
          message: El cuerpo de la solicitud contiene campos no válidos.
          details:
            violations:
              - path: /name
                message: El nombre es obligatorio.
    Category:
      type: object
      description: Categoría comercial que permite clasificar las entradas del catálogo.
      required:
        - id
        - name
        - entryCount
      properties:
        id:
          type: string
          format: uuid
          description: Identificador UUID de la categoría.
          example: 7d9c8f30-6c64-4f12-9a1b-6c4a2d5e8f01
        name:
          type: string
          description: Nombre que se muestra para la categoría.
          example: Bebidas
        description:
          type: string
          description: Explicación breve opcional; si no existe, se omite de la respuesta.
          example: Bebidas frías y preparadas.
        entryCount:
          type: integer
          minimum: 0
          description: Cantidad de entradas asociadas a la categoría.
          example: 4
      example:
        id: 7d9c8f30-6c64-4f12-9a1b-6c4a2d5e8f01
        name: Bebidas
        description: Bebidas frías y preparadas.
        entryCount: 4
    CategoryReference:
      type: object
      description: Referencia resumida a una categoría asociada con una entrada.
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
          description: Identificador UUID de la categoría.
          example: 7d9c8f30-6c64-4f12-9a1b-6c4a2d5e8f01
        name:
          type: string
          description: Nombre de la categoría.
          example: Bebidas
    CategoryCreateRequest:
      type: object
      description: Datos para crear una categoría.
      required:
        - name
      properties:
        name:
          type: string
          description: Nombre que tendrá la nueva categoría.
          example: Bebidas
        description:
          type: string
          description: Explicación breve opcional del contenido de la categoría.
          example: Bebidas frías y preparadas.
    CategoryPatchRequest:
      type: object
      description: Campos de categoría que se desean actualizar.
      properties:
        name:
          type: string
          description: Nuevo nombre de la categoría, si se desea cambiar.
          example: Bebidas preparadas
        description:
          type: string
          description: Campo opcional; si se omite, se conserva el valor actual. Una cadena vacía permite dejar la categoría sin texto descriptivo.
          example: Bebidas frías y preparadas al momento.
    CategoryListResponse:
      type: object
      description: Colección paginada de categorías.
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        meta:
          $ref: '#/components/schemas/PageMeta'
    CategoryResponse:
      type: object
      description: Respuesta que contiene una categoría.
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Category'
    EntryStatus:
      type: string
      description: Estado administrativo de una entrada del catálogo.
      enum:
        - ACTIVE
        - INACTIVE
        - ARCHIVED
      example: ACTIVE
    CatalogEntrySummary:
      type: object
      description: Campos de catálogo que identifican una entrada y resumen su clasificación y cantidad de ofertas.
      required:
        - id
        - brandName
        - description
        - status
        - image
        - categories
        - offerCount
      properties:
        id:
          type: string
          format: uuid
          description: Identificador UUID de la entrada.
          example: 82f7c6d4-3d9a-4fa1-bf2c-7b8d9e0f1a23
        brandName:
          type: string
          description: Nombre comercial que se muestra para la entrada.
          example: Hamburguesa Hawaiana
