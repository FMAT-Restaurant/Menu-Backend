    ValidationViolation:
      type: object
      description: Incumplimiento de validación asociado a un campo del cuerpo de la solicitud.
      required:
        - path
        - message
      properties:
        path:
          type: string
          description: Ruta que identifica el campo del cuerpo de la solicitud que no supera la validación.
          example: /name
        message:
          type: string
          description: Explicación de la regla de validación incumplida por el campo.
          example: El nombre es obligatorio.
      example:
        path: /name
        message: El nombre es obligatorio.
    ValidationError:
      description: Error estándar con al menos una infracción de validación en sus detalles.
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required:
            - details
          properties:
            details:
              type: object
              required:
                - violations
              properties:
                violations:
                  type: array
                  minItems: 1
                  description: Infracciones de validación encontradas en el cuerpo de la solicitud.
                  items:
                    $ref: '#/components/schemas/ValidationViolation'
              additionalProperties: true
      example:
        message: El cuerpo de la solicitud contiene campos no válidos.
        details:
          violations:
            - path: /name
              message: El nombre es obligatorio.
    RecipeSlotOptionInput:
