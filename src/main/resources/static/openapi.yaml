  /media/images:
    post:
      tags:
        - Imágenes
      operationId: uploadMenuImage
      summary: Subir una imagen
      description: 'Sube el archivo del campo file mediante multipart/form-data. Acepta JPEG, PNG y WebP de hasta 10 MiB (10485760 bytes), con ancho y alto máximos de 4096 px cada uno. Valida el contenido real y su decodificación, además del tipo declarado. Solo tras validar la carga, el servidor genera el UUID y devuelve data.id, data.url y data.thumbnailUrl. El cliente utiliza data.id como imageId en las solicitudes JSON de creación o edición de entradas y ofertas, sin reenviar el archivo. La carga y la asociación son operaciones separadas: cargar una imagen no crea una entrada ni una oferta. Una imagen inválida devuelve 422 sin crear una imagen utilizable ni modificar un recurso existente o su revisión.'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Archivo JPEG, PNG o WebP de hasta 10 MiB (10485760 bytes), con ancho y alto máximos de 4096 px cada uno. Su contenido real debe ser válido y decodificable, además de coincidir con el tipo declarado.
            encoding:
              file:
                contentType: image/jpeg, image/png, image/webp
            examples:
              archivoDeMenu:
                summary: Archivo de imagen seleccionado para cargar
                value:
                  file: hamburguesa-hawaiana.jpg
      responses:
        '201':
          description: Imagen validada, con UUID generado por el servidor y URL disponibles.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageUploadResponse'
              examples:
                imagenCargada:
                  summary: Imagen validada con identificador generado por el servidor
                  value:
                    data:
                      id: 55e62412-9249-4db6-8ccb-31f19ea2f501
                      url: https://cdn.example.com/menu/hamburguesa-hawaiana.jpg
                      thumbnailUrl: https://cdn.example.com/menu/hamburguesa-hawaiana-thumb.jpg
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token de acceso indicado en api.md.
  schemas:
    PageMeta:
      type: object
      description: Metadatos que indican qué página se devolvió y el tamaño y total de la colección paginada.
      required:
        - page
        - pageSize
        - total
        - totalPages
      properties:
        page:
          type: integer
          minimum: 1
          description: Número de la página devuelta, empezando en 1.
          example: 1
        pageSize:
          type: integer
          minimum: 1
          description: Cantidad solicitada de elementos por página; admite cualquier entero positivo.
          example: 12
        total:
          type: integer
          minimum: 0
          description: Cantidad total de elementos que coinciden con la consulta.
          example: 0
        totalPages:
          type: integer
          minimum: 0
          description: Cantidad total de páginas para el tamaño solicitado.
          example: 0
      example:
        page: 2
        pageSize: 20
        total: 51
        totalPages: 3
    Image:
      type: object
      description: Imagen de catálogo y sus URL de visualización.
      required:
        - id
        - url
        - thumbnailUrl
      properties:
        id:
          type: string
          format: uuid
          description: Identificador UUID de la imagen.
          example: 6b78d901-2c3a-4f5b-8d6e-7a9b0c1d2e3f
        url:
          type: string
          format: uri
          description: URL de la imagen original.
          example: https://cdn.example.com/menu/burger.jpg
        thumbnailUrl:
          type: string
          format: uri
          description: URL de la miniatura de la imagen.
          example: https://cdn.example.com/menu/burger-thumbnail.jpg
      example:
        id: 6b78d901-2c3a-4f5b-8d6e-7a9b0c1d2e3f
        url: https://cdn.example.com/menu/burger.jpg
        thumbnailUrl: https://cdn.example.com/menu/burger-thumbnail.jpg
    InventoryItem:
      type: object
      description: Insumo de inventario referenciado por una receta u opción de una composición.
      required:
        - id
        - name
        - unit
      properties:
        id:
          type: string
          minLength: 1
          description: Identificador de texto opaco del insumo, asignado por Inventario. Se conserva sin normalizar y no admite valores vacíos ni en blanco.
          example: INV-potatoes-001
        name:
          type: string
          description: Nombre legible del insumo.
          example: Carne Molida Res 80/20
        unit:
          type: string
          description: Unidad usada para expresar la cantidad del insumo.
          example: g
      example:
        id: INV-potatoes-001
        name: Carne Molida Res 80/20
        unit: g
    Error:
      type: object
      description: Datos del error devuelto por la API.
      required:
        - message
      properties:
        message:
          type: string
          description: Explicación del error para quien consume la API.
        details:
          type: object
          description: Datos adicionales opcionales y específicos de la respuesta de error.
          additionalProperties: true
    ErrorEnvelope:
      type: object
      description: Envoltura estándar de una respuesta de error.
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/Error'
    ValidationErrorEnvelope:
      type: object
      description: Envoltura estándar que contiene un error de validación.
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ValidationError'
      example:
        error:
          message: El cuerpo de la solicitud contiene campos no válidos.
          details:
            violations:
              - path: /name
                message: El nombre es obligatorio.
    Category:
      type: object
      description: Categoría comercial que permite clasificar las entradas del catálogo.
      required:
        - id
        - name
        - entryCount
      properties:
        id:
          type: string
          format: uuid
          description: Identificador UUID de la categoría.
          example: 7d9c8f30-6c64-4f12-9a1b-6c4a2d5e8f01
        name:
          type: string
          description: Nombre que se muestra para la categoría.
          example: Bebidas
        description:
          type: string
          description: Explicación breve opcional; si no existe, se omite de la respuesta.
          example: Bebidas frías y preparadas.
        entryCount:
          type: integer
          minimum: 0
          description: Cantidad de entradas asociadas a la categoría.
          example: 4
      example:
        id: 7d9c8f30-6c64-4f12-9a1b-6c4a2d5e8f01
        name: Bebidas
        description: Bebidas frías y preparadas.
        entryCount: 4
    CategoryReference:
      type: object
      description: Referencia resumida a una categoría asociada con una entrada.
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
          description: Identificador UUID de la categoría.
          example: 7d9c8f30-6c64-4f12-9a1b-6c4a2d5e8f01
        name:
          type: string
          description: Nombre de la categoría.
          example: Bebidas
    CategoryCreateRequest:
      type: object
      description: Datos para crear una categoría.
      required:
        - name
      properties:
        name:
          type: string
          description: Nombre que tendrá la nueva categoría.
          example: Bebidas
        description:
          type: string
          description: Explicación breve opcional del contenido de la categoría.
          example: Bebidas frías y preparadas.
    CategoryPatchRequest:
      type: object
      description: Campos de categoría que se desean actualizar.
      properties:
        name:
          type: string
          description: Nuevo nombre de la categoría, si se desea cambiar.
          example: Bebidas preparadas
        description:
          type: string
          description: Campo opcional; si se omite, se conserva el valor actual. Una cadena vacía permite dejar la categoría sin texto descriptivo.
          example: Bebidas frías y preparadas al momento.
    CategoryListResponse:
      type: object
      description: Colección paginada de categorías.
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        meta:
          $ref: '#/components/schemas/PageMeta'
    CategoryResponse:
      type: object
      description: Respuesta que contiene una categoría.
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Category'
    EntryStatus:
      type: string
      description: Estado administrativo de una entrada del catálogo.
      enum:
        - ACTIVE
        - INACTIVE
        - ARCHIVED
      example: ACTIVE
    CatalogEntrySummary:
      type: object
      description: Campos de catálogo que identifican una entrada y resumen su clasificación y cantidad de ofertas.
      required:
        - id
        - brandName
        - description
        - status
        - image
        - categories
        - offerCount
      properties:
        id:
          type: string
          format: uuid
          description: Identificador UUID de la entrada.
          example: 82f7c6d4-3d9a-4fa1-bf2c-7b8d9e0f1a23
        brandName:
          type: string
          description: Nombre comercial que se muestra para la entrada.
          example: Hamburguesa Hawaiana
        description:
          type: string
          description: Descripción de la entrada del catálogo.
          example: Hamburguesa con piña asada y queso.
        status:
          $ref: '#/components/schemas/EntryStatus'
        image:
          $ref: '#/components/schemas/Image'
        categories:
          description: Categorías asociadas a la entrada.
          type: array
          items:
            $ref: '#/components/schemas/CategoryReference'
        offerCount:
          type: integer
          minimum: 0
          description: Cantidad de ofertas asociadas a la entrada.
          example: 2
      example:
        id: 82f7c6d4-3d9a-4fa1-bf2c-7b8d9e0f1a23
        brandName: Hamburguesa Hawaiana
        description: Hamburguesa con piña asada y queso.
        status: ACTIVE
        image:
          id: 6b78d901-2c3a-4f5b-8d6e-7a9b0c1d2e3f
          url: https://cdn.example.com/menu/burger.jpg
          thumbnailUrl: https://cdn.example.com/menu/burger-thumbnail.jpg
        categories:
          - id: 7d9c8f30-6c64-4f12-9a1b-6c4a2d5e8f01
            name: Hamburguesas
        offerCount: 2
    CatalogEntryDetail:
      type: object
      description: Datos completos de una entrada, incluidos sus identificadores de categoría.
      required:
        - id
        - brandName
        - description
        - status
        - image
        - categoryIds
      properties:
        id:
          type: string
          format: uuid
          description: Identificador UUID de la entrada.
          example: 82f7c6d4-3d9a-4fa1-bf2c-7b8d9e0f1a23
        brandName:
          type: string
          description: Nombre comercial que se muestra para la entrada.
          example: Hamburguesa Hawaiana
        description:
          type: string
          description: Descripción de la entrada del catálogo.
          example: Hamburguesa con piña asada y queso.
        status:
          $ref: '#/components/schemas/EntryStatus'
        image:
          $ref: '#/components/schemas/Image'
        categoryIds:
          description: Identificadores UUID de las categorías asociadas a la entrada.
          type: array
          items:
            type: string
            format: uuid
          example:
            - 7d9c8f30-6c64-4f12-9a1b-6c4a2d5e8f01
      example:
        id: 82f7c6d4-3d9a-4fa1-bf2c-7b8d9e0f1a23
        brandName: Hamburguesa Hawaiana
        description: Hamburguesa con piña asada y queso.
        status: ACTIVE
        image:
          id: 6b78d901-2c3a-4f5b-8d6e-7a9b0c1d2e3f
          url: https://cdn.example.com/menu/burger.jpg
          thumbnailUrl: https://cdn.example.com/menu/burger-thumbnail.jpg
        categoryIds:
          - 7d9c8f30-6c64-4f12-9a1b-6c4a2d5e8f01
    CatalogEntryCreateRequest:
      type: object
      description: Datos JSON para crear una entrada y asociarla con sus categorías y una imagen previamente cargada y validada. El backend asigna el estado INACTIVE; el cliente no proporciona status. imageId referencia data.id de la respuesta de POST /api/v1/media/images; no se envía el archivo ni una URL en esta solicitud.
      required:
        - brandName
        - description
        - categoryIds
        - imageId
      additionalProperties: false
      properties:
        brandName:
          type: string
          description: Nombre comercial de la nueva entrada.
          example: Hamburguesa Hawaiana
        description:
          type: string
          description: Descripción de la nueva entrada.
          example: Hamburguesa con piña asada y queso.
        categoryIds:
          description: Identificadores UUID de las categorías que se asociarán a la entrada.
          type: array
          items:
            type: string
            format: uuid
          example:
            - 7d9c8f30-6c64-4f12-9a1b-6c4a2d5e8f01
        imageId:
          type: string
          format: uuid
          description: UUID obligatorio de la imagen previamente cargada y validada, obtenido de data.id en POST /api/v1/media/images. No admite null, archivos ni URLs.
          example: 55e62412-9249-4db6-8ccb-31f19ea2f501
      example:
        brandName: Hamburguesa Hawaiana
        description: Hamburguesa con piña asada y queso.
        categoryIds:
          - 7d9c8f30-6c64-4f12-9a1b-6c4a2d5e8f01
        imageId: 55e62412-9249-4db6-8ccb-31f19ea2f501
    CatalogEntryPatchRequest:
      type: object
      description: Campos de una entrada que se desean actualizar, enviados como JSON. Los campos omitidos conservan sus valores vigentes. Para reemplazar la imagen se envía imageId con data.id de la respuesta de POST /api/v1/media/images para una imagen previamente cargada y validada. Omitir imageId conserva la imagen vigente; null se rechaza. No se envían archivos ni URLs en esta solicitud.
      additionalProperties: false
      properties:
        brandName:
          type: string
          description: Nuevo nombre comercial, si se desea cambiar.
          example: Hamburguesa Hawaiana Especial
        description:
          type: string
          description: Nueva descripción, si se desea cambiar.
          example: Hamburguesa con piña asada, queso y salsa de la casa.
        status:
          $ref: '#/components/schemas/EntryStatus'
          description: Estado administrativo solicitado. Se permite activar o inactivar una entrada y pasar de ACTIVE o INACTIVE a ARCHIVED. Desarchivar requiere pasar de ARCHIVED a INACTIVE; se rechaza el paso directo de ARCHIVED a ACTIVE.
        categoryIds:
          description: Identificadores UUID de las categorías asociadas a la entrada. Al enviar este campo se reemplaza el conjunto completo de categorías; al omitirlo se conserva el conjunto vigente.
          type: array
          items:
            type: string
            format: uuid
          example:
            - 7d9c8f30-6c64-4f12-9a1b-6c4a2d5e8f01
        imageId:
          type: string
          format: uuid
          description: UUID de la imagen de reemplazo previamente cargada y validada, obtenido de data.id en POST /api/v1/media/images. Omitirlo conserva la imagen vigente; no admite null, archivos ni URLs.
          example: 55e62412-9249-4db6-8ccb-31f19ea2f501
    CatalogEntryListResponse:
      type: object
      description: Página de entradas que coincide con los filtros de la consulta.
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CatalogEntrySummary'
        meta:
          $ref: '#/components/schemas/PageMeta'
    CatalogEntryResponse:
      type: object
      description: Respuesta que contiene una entrada del catálogo.
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/CatalogEntryDetail'
    OfferStatus:
      type: string
      description: Estado de disponibilidad de una oferta del catálogo.
      enum:
        - ACTIVE
        - INACTIVE
      example: ACTIVE
    CatalogOfferSummary:
      type: object
      description: Campos que resumen una oferta del catálogo, su entrada asociada y su composición.
      required:
        - id
        - entryId
        - entryName
        - presentationTag
        - basePrice
        - status
        - image
        - slotCount
      properties:
        id:
          type: string
          format: uuid
          description: Identificador UUID de la oferta.
          example: 4f3b2d1c-9e8a-47b6-85d4-1a2b3c4d5e6f
        entryId:
          type: string
          format: uuid
          description: Identificador UUID de la entrada a la que pertenece la oferta.
          example: 82f7c6d4-3d9a-4fa1-bf2c-7b8d9e0f1a23
        entryName:
          type: string
          description: Nombre comercial de la entrada asociada.
          example: Hamburguesa Hawaiana
        presentationTag:
          type: string
          description: Etiqueta que distingue esta presentación de la entrada.
          example: Combo
        basePrice:
          type: number
          description: Precio base de la oferta.
          example: 180
        status:
          $ref: '#/components/schemas/OfferStatus'
        image:
          $ref: '#/components/schemas/Image'
        slotCount:
          type: integer
          minimum: 0
          description: Cantidad de slots que contiene la composición.
          example: 2
      example:
        id: 4f3b2d1c-9e8a-47b6-85d4-1a2b3c4d5e6f
        entryId: 82f7c6d4-3d9a-4fa1-bf2c-7b8d9e0f1a23
        entryName: Hamburguesa Hawaiana
        presentationTag: Combo
        basePrice: 180
        status: ACTIVE
        image:
          id: 6b78d901-2c3a-4f5b-8d6e-7a9b0c1d2e3f
          url: https://cdn.example.com/menu/burger.jpg
          thumbnailUrl: https://cdn.example.com/menu/burger-thumbnail.jpg
        slotCount: 2
    CatalogOfferDetail:
      type: object
      description: Datos completos de una oferta, incluidos los slots y las opciones de su composición.
      required:
        - id
        - entryId
        - presentationTag
        - basePrice
        - status
        - image
        - composition
      properties:
        id:
          type: string
          format: uuid
          description: Identificador UUID de la oferta.
          example: 4f3b2d1c-9e8a-47b6-85d4-1a2b3c4d5e6f
        entryId:
          type: string
          format: uuid
          description: Identificador UUID de la entrada a la que pertenece la oferta.
          example: 82f7c6d4-3d9a-4fa1-bf2c-7b8d9e0f1a23
        presentationTag:
          type: string
          description: Etiqueta que distingue esta presentación de la entrada.
          example: Combo
        basePrice:
          type: number
          description: Precio base de la oferta.
          example: 180
        status:
          $ref: '#/components/schemas/OfferStatus'
        image:
          $ref: '#/components/schemas/Image'
        composition:
          $ref: '#/components/schemas/Composition'
      example:
        id: 4f3b2d1c-9e8a-47b6-85d4-1a2b3c4d5e6f
        entryId: 82f7c6d4-3d9a-4fa1-bf2c-7b8d9e0f1a23
        presentationTag: Combo
        basePrice: 180
        status: ACTIVE
        image:
          id: 6b78d901-2c3a-4f5b-8d6e-7a9b0c1d2e3f
          url: https://cdn.example.com/menu/burger.jpg
          thumbnailUrl: https://cdn.example.com/menu/burger-thumbnail.jpg
        composition:
          slots:
            - slotId: c3d4e5f6-789a-4bcd-8ef0-123456789abc
              name: Hamburguesa
              quantity: 1
              course: plato fuerte
              options:
                - optionId: a1b2c3d4-e5f6-4789-8abc-def012345678
                  sourceType: RECIPE
                  recipeId: 9a6c4d2e-1f3b-48a5-8c7d-6e5f4a3b2c1d
                  recipeRevision: 3
                  displayName: Hamburguesa hawaiana
    CatalogOfferCreateRequest:
      type: object
      description: Datos JSON para crear una oferta y definir su composición inicial. La imagen se carga previamente mediante POST /api/v1/media/images y esta solicitud asocia su identificador; la carga y la asociación son operaciones separadas. No se envían archivos ni URLs en esta solicitud. Los UUID de los slots y las opciones los genera el servidor; no deben incluirse en este cuerpo. El servidor asigna INACTIVE al crear la oferta; su activación manual se realiza después mediante una actualización.
      additionalProperties: false
      required:
        - basePrice
        - composition
        - imageId
      properties:
        presentationTag:
          type: string
          description: Etiqueta que distingue esta presentación de la entrada.
          example: Combo
        basePrice:
          type: number
          description: Precio base de la oferta.
          example: 180
        imageId:
          type: string
          format: uuid
          description: UUID obligatorio de la imagen previamente cargada y validada, obtenido de data.id en POST /api/v1/media/images. Debe identificar una imagen existente y accesible al solicitante; no admite null, archivos ni URLs.
          example: 6b78d901-2c3a-4f5b-8d6e-7a9b0c1d2e3f
        composition:
          $ref: '#/components/schemas/CompositionInput'
      example:
        presentationTag: Combo
        basePrice: 180
        imageId: 6b78d901-2c3a-4f5b-8d6e-7a9b0c1d2e3f
        composition:
          slots:
            - name: Hamburguesa
              quantity: 1
              course: plato fuerte
              options:
                - sourceType: RECIPE
                  recipeId: 9a6c4d2e-1f3b-48a5-8c7d-6e5f4a3b2c1d
                  recipeRevision: 3
                  displayName: Hamburguesa hawaiana
    CatalogOfferPatchRequest:
      type: object
      description: 'Campos de una oferta que se desean actualizar mediante JSON. La imagen de reemplazo se carga previamente mediante POST /api/v1/media/images; esta solicitud actualiza su asociación con imageId. La carga y la asociación son operaciones separadas. No se envían archivos ni URLs en esta solicitud. Los campos omitidos se conservan recursivamente; un objeto vacío conserva todos los valores y composition vacío conserva sus slots. Enviar slots u options reemplaza su conjunto completo; los elementos existentes incluidos pueden omitir campos para conservarlos y las opciones omitidas de un slot existente se conservan. Las listas vacías devuelven 422. Los identificadores existentes deben pertenecer a la oferta y al slot correspondiente: desconocidos, ajenos o duplicados se rechazan con 422; no se mueven elementos ni se crean con ID proporcionado. Los nuevos elementos omiten su ID y el servidor lo genera. Se valida el resultado completo y las invariantes antes de persistir; cualquier error rechaza toda la operación. Se recalculan los estados de slots y oferta según las opciones y su habilitación administrativa. If-Match protege la actualización de modificaciones concurrentes.'
      additionalProperties: false
      properties:
        presentationTag:
          type: string
          description: Nueva etiqueta de presentación, si se desea cambiar.
          example: Combo familiar
        basePrice:
          type: number
          description: Nuevo precio base, si se desea cambiar.
          example: 195
        status:
          $ref: '#/components/schemas/OfferStatus'
          description: Estado administrativo solicitado. Activar exige una composición válida con al menos un slot ACTIVE. Una solicitud INACTIVE explícita prevalece sobre la reactivación automática.
        imageId:
          type: string
          format: uuid
          description: UUID opcional de la imagen de reemplazo previamente cargada y validada, obtenido de data.id en POST /api/v1/media/images. Debe identificar una imagen existente y accesible al solicitante. Omitirlo conserva la imagen vigente; no admite null, archivos ni URLs.
          example: 6b78d901-2c3a-4f5b-8d6e-7a9b0c1d2e3f
        composition:
          $ref: '#/components/schemas/CompositionPatchInput'
    CatalogOfferListResponse:
      type: object
      description: Página de ofertas que coincide con los filtros de la consulta.
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CatalogOfferSummary'
        meta:
          $ref: '#/components/schemas/PageMeta'
    CatalogOfferResponse:
      type: object
      description: Respuesta que contiene una oferta del catálogo.
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/CatalogOfferDetail'
    CatalogOfferPatchResponse:
      type: object
      description: Respuesta del PATCH de una oferta con los estados y datos de origen completos.
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/CatalogOfferPatchDetail'
    Composition:
      type: object
      description: Composición de una oferta, expresada como una colección de slots.
      required:
        - slots
      properties:
        slots:
          type: array
          description: Slots que forman la composición de la oferta.
          items:
            $ref: '#/components/schemas/CompositionSlot'
      example:
        slots:
          - slotId: c3d4e5f6-789a-4bcd-8ef0-123456789abc
            name: Hamburguesa
            quantity: 1
            course: plato fuerte
            options:
              - optionId: a1b2c3d4-e5f6-4789-8abc-def012345678
                sourceType: RECIPE
                recipeId: 9a6c4d2e-1f3b-48a5-8c7d-6e5f4a3b2c1d
                recipeRevision: 3
                displayName: Hamburguesa hawaiana
    CompositionInput:
      type: object
      description: Datos de la composición inicial enviados al crear una oferta.
      additionalProperties: false
      required:
        - slots
      properties:
        slots:
          type: array
          description: Slots que forman la composición enviada.
          items:
            $ref: '#/components/schemas/CompositionSlotInput'
    CompositionPatchInput:
      type: object
      additionalProperties: false
      description: Composición enviada al PATCH; omitir slots o enviar un objeto vacío conserva los slots vigentes. Enviar slots reemplaza el conjunto completo y no admite una lista vacía.
      properties:
        slots:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CompositionSlotPatchInput'
    CompositionSlotPatchInput:
      type: object
      additionalProperties: false
      description: Con slotId actualiza un slot existente de esta oferta y conserva los campos omitidos. Sin slotId crea un slot y requiere name, quantity y options; el servidor genera su ID. options reemplaza el conjunto completo al enviarse; omitirlo en un slot existente conserva sus opciones. IDs desconocidos, ajenos o duplicados se rechazan con 422; no permite mover slots ni crear nuevos con ID. course null retira el curso opcional.
      properties:
        slotId:
          type: string
          format: uuid
        name:
          type: string
        quantity:
          type: number
          description: Rango y precisión pendientes en OPEN-006.
        course:
          type:
            - string
            - 'null'
          enum:
            - entrada
            - plato fuerte
            - postre
            - bebida
            - null
        options:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SlotOptionPatchInput'
      allOf:
        - if:
            not:
              properties:
                slotId: {}
                name: {}
                quantity: {}
                course: {}
                options: {}
              required:
                - slotId
          then:
            properties:
              name: {}
              quantity: {}
              options: {}
              slotId: {}
              course: {}
            required:
              - name
              - quantity
              - options
    SlotOptionPatchInput:
      description: Con optionId actualiza una opción existente del slot y conserva los campos omitidos; sourceType debe coincidir con el tipo almacenado para que los cambios parciales sean válidos. Sin optionId crea una opción nueva; debe incluir displayName, status y la tupla completa del origen indicado. El servidor genera el ID. IDs desconocidos, ajenos o duplicados se rechazan con 422; no se pueden mover opciones ni crear nuevas con ID. Para cambiar el tipo de una opción existente, se debe enviar sourceType y la tupla completa del nuevo origen; el servidor aplica el cambio atómicamente.
      oneOf:
        - $ref: '#/components/schemas/RecipeSlotOptionPatchInput'
        - $ref: '#/components/schemas/InventoryItemSlotOptionPatchInput'
    CompositionSlot:
      type: object
      description: Slot de la composición con una cantidad, un curso y las opciones que pueden ocuparlo.
      required:
        - slotId
        - name
        - quantity
        - options
      properties:
        slotId:
          type: string
          format: uuid
          description: Identificador UUID del slot.
          example: c3d4e5f6-789a-4bcd-8ef0-123456789abc
        name:
          type: string
          description: Nombre que identifica el slot dentro de la composición.
          example: Hamburguesa
        status:
          $ref: '#/components/schemas/OfferStatus'
          description: Estado derivado, incluido en la respuesta del PATCH; ACTIVE si alguna opción está ACTIVE e INACTIVE si ninguna lo está.
        quantity:
          type: number
          description: Rango y precisión no definidos en la fuente.
          example: 1
        course:
          type: string
          enum:
            - entrada
            - plato fuerte
            - postre
            - bebida
          description: Curso al que pertenece el slot, si se especifica.
          example: plato fuerte
        options:
          type: array
          description: Opciones disponibles para ocupar el slot.
          items:
            $ref: '#/components/schemas/SlotOption'
      example:
        slotId: c3d4e5f6-789a-4bcd-8ef0-123456789abc
        name: Hamburguesa
        quantity: 1
        course: plato fuerte
        options:
          - optionId: a1b2c3d4-e5f6-4789-8abc-def012345678
            sourceType: RECIPE
            recipeId: 9a6c4d2e-1f3b-48a5-8c7d-6e5f4a3b2c1d
            recipeRevision: 3
            displayName: Hamburguesa hawaiana
    CompositionSlotInput:
      type: object
      description: Datos para crear un slot de una composición; el servidor genera slotId. course es opcional; omitirlo o enviarlo como null crea el slot sin curso.
      additionalProperties: false
      required:
        - name
        - quantity
        - options
      properties:
        name:
          type: string
          description: Nombre que identifica el slot dentro de la composición.
          example: Hamburguesa
        quantity:
          type: number
          description: Rango y precisión no definidos en la fuente.
          example: 1
        course:
          type:
            - string
            - 'null'
          enum:
            - entrada
            - plato fuerte
            - postre
            - bebida
            - null
          description: Curso al que pertenece el slot, si se especifica.
          example: plato fuerte
        options:
          type: array
          description: Opciones disponibles para ocupar el slot.
          items:
            $ref: '#/components/schemas/SlotOptionInput'
      example:
        name: Hamburguesa
        quantity: 1
        course: plato fuerte
        options:
          - sourceType: RECIPE
            recipeId: 9a6c4d2e-1f3b-48a5-8c7d-6e5f4a3b2c1d
            recipeRevision: 3
            displayName: Hamburguesa hawaiana
    SlotOption:
      description: Opción de un slot; cada opción identifica una receta o un insumo de inventario.
      oneOf:
        - $ref: '#/components/schemas/RecipeSlotOption'
        - $ref: '#/components/schemas/InventoryItemSlotOption'
    SlotOptionInput:
      description: Datos de una opción de slot con uno de los dos tipos de origen admitidos.
      oneOf:
        - $ref: '#/components/schemas/RecipeSlotOptionInput'
        - $ref: '#/components/schemas/InventoryItemSlotOptionInput'
    RecipeSummary:
      type: object
