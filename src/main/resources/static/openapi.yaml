    post:
      tags:
        - Ofertas
      operationId: createEntryOffer
      summary: Crear una oferta para una entrada
      description: 'Crea una oferta asociada a la entrada indicada en la ruta. La composición define los espacios de selección y sus opciones. La imagen es obligatoria: cárguela antes mediante POST /api/v1/media/images y envíe data.id de la respuesta como imageId en el cuerpo JSON. Esta operación no recibe archivos ni URLs. imageId debe identificar una imagen existente, válida y accesible al solicitante; una referencia inválida devuelve 422 sin crear la oferta. Toda oferta se crea con estado INACTIVE y debe activarse manualmente después. El servidor asigna status: ACTIVE a todas las opciones nuevas; el cuerpo de POST no acepta status para las opciones. Si falla la consulta a Inventario necesaria para validar un origen INVENTORY_ITEM, devuelve 502 sin crear la oferta; un artículo de inventario inválido devuelve 422. La carga previa es una operación independiente y no se deshace si falla la creación de la oferta. Requiere Idempotency-Key, un UUID generado por el cliente por creación lógica, con alcance por usuario autenticado, menú, método POST y ruta concreta (incluido entryId). Durante 24 horas desde la primera creación confirmada, reenviar la misma clave y el mismo JSON semántico devuelve el 201, cuerpo y ETag originales, con la misma oferta, slots, opciones e imagen; no repite efectos ni resuelve otra vez las revisiones de recetas. El orden de propiedades y los espacios del JSON no alteran su igualdad; el orden de arrays y la diferencia entre omisión y null sí la alteran. Tras autenticar y autorizar al solicitante, el resultado guardado se recupera antes de validar los recursos o referencias vigentes, incluso si después fueron editados o eliminados. Otra carga JSON con la misma clave devuelve 409 con error.details.code IDEMPOTENCY_KEY_REUSED; una creación todavía en curso devuelve 409 con error.details.code IDEMPOTENCY_IN_PROGRESS y Retry-After. La ausencia o invalidez del encabezado devuelve 400. Los errores anteriores a la creación confirmada, incluido 502, no fijan un resultado y liberan la clave para reintentar la misma solicitud. Los reintentos no extienden el plazo; después de 24 horas la clave puede tratarse como nueva y ya no garantiza evitar duplicados. Una opción RECIPE se selecciona solo por recipeId: al asignarla, el servidor resuelve atómicamente la revisión válida publicada más reciente y la conserva internamente; no se expone una revisión en la opción. Una receta inexistente o sin revisión válida devuelve 422 sin aplicar cambios.'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogOfferCreateRequest'
            examples:
              ofertaConReceta:
                summary: Crear una oferta con una opción de receta
                value:
                  presentationTag: Individual
                  basePrice: 185
                  imageId: 8c3f4365-1d1d-4a85-969a-c6c80757b201
                  composition:
                    slots:
                      - name: Plato principal
                        quantity: 1
                        course: plato fuerte
                        options:
                          - sourceType: RECIPE
                            recipeId: c4813f65-00b4-4921-874e-03c555796401
                            displayName: Hamburguesa Hawaiana
              ofertaConInventario:
                summary: Crear una oferta con una opción de insumo de inventario
                value:
                  presentationTag: Individual
                  basePrice: 180
                  imageId: 8c3f4365-1d1d-4a85-969a-c6c80757b201
                  composition:
                    slots:
                      - name: Acompañamiento
                        quantity: 1
                        course: plato fuerte
                        options:
                          - sourceType: INVENTORY_ITEM
                            inventoryItemId: CARNE-150G
                            quantity: 200
                            unit: g
                            displayName: Papas
      responses:
        '201':
          description: Oferta creada; un reintento idempotente reproduce el cuerpo y el ETag de la creación original.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CatalogOfferResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/CatalogOfferDetail'
                          - type: object
                            properties:
                              status:
                                type: string
                                const: INACTIVE
              examples:
                ofertaCreadaConReceta:
                  summary: Oferta creada con una opción de receta
                  value:
                    data:
                      id: b57f7e2a-02a4-4fb7-bb41-55f2d974b101
                      entryId: 7d19a8ce-402c-4bab-b383-9969b69fe101
                      presentationTag: Individual
                      basePrice: 185
                      status: INACTIVE
                      image:
                        id: 8c3f4365-1d1d-4a85-969a-c6c80757b201
                        url: https://cdn.example.com/menu/hamburguesa-individual.jpg
                        thumbnailUrl: https://cdn.example.com/menu/hamburguesa-individual-thumb.jpg
                      composition:
                        slots:
                          - slotId: b37c1bd7-17b2-47a2-a3a4-802559445301
                            name: Plato principal
                            quantity: 1
                            course: plato fuerte
                            options:
                              - optionId: 89cce4da-2f19-4d27-942d-b2ee82fb5401
                                sourceType: RECIPE
                                recipeId: c4813f65-00b4-4921-874e-03c555796401
                                displayName: Hamburguesa Hawaiana
                                status: ACTIVE
                ofertaCreadaConInventario:
                  summary: Oferta creada con una opción de insumo de inventario
                  value:
                    data:
                      id: c68f8a31-7f0e-4b4b-a8ed-118da2ce4102
