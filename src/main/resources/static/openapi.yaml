    CatalogOfferPatchRequest:
      type: object
      description: 'Campos de una oferta que se desean actualizar mediante JSON. La imagen de reemplazo se carga previamente mediante POST /api/v1/media/images; esta solicitud actualiza su asociación con imageId. La carga y la asociación son operaciones separadas. No se envían archivos ni URLs en esta solicitud. presentationTag es obligatorio en toda solicitud; si no se desea cambiar, se reenvía su valor vigente. Los demás campos omitidos se conservan recursivamente; composition vacío conserva sus slots. Enviar slots u options reemplaza su conjunto completo; los elementos existentes incluidos pueden omitir campos para conservarlos y las opciones omitidas de un slot existente se conservan. Las listas vacías devuelven 422. Los identificadores existentes deben pertenecer a la oferta y al slot correspondiente: desconocidos, ajenos o duplicados se rechazan con 422; no se mueven elementos ni se crean con ID proporcionado. Los nuevos elementos omiten su ID y el servidor lo genera. Se valida el resultado completo y las invariantes antes de persistir; cualquier error rechaza toda la operación. Se recalculan los estados de slots y oferta según las opciones y su habilitación administrativa. If-Match protege la actualización de modificaciones concurrentes.'
      additionalProperties: false
      required:
        - presentationTag
      properties:
        presentationTag:
          type: string
          description: Etiqueta obligatoria de presentación; reenviar el valor vigente si no se desea cambiar. No admite null.
          example: Combo familiar
        basePrice:
          type: number
          description: Nuevo precio base, si se desea cambiar.
          example: 195
        status:
          $ref: '#/components/schemas/OfferStatus'
          description: Estado administrativo solicitado. Activar exige una composición válida con al menos un slot ACTIVE. Una solicitud INACTIVE explícita prevalece sobre la reactivación automática.
        imageId:
          type: string
          format: uuid
          description: UUID opcional de la imagen de reemplazo previamente cargada y validada, obtenido de data.id en POST /api/v1/media/images. Debe identificar una imagen existente y accesible al solicitante. Omitirlo conserva la imagen vigente; no admite null, archivos ni URLs.
          example: 6b78d901-2c3a-4f5b-8d6e-7a9b0c1d2e3f
        composition:
          $ref: '#/components/schemas/CompositionPatchInput'
    CatalogOfferListResponse:
      type: object
      description: Página de ofertas que coincide con los filtros de la consulta.
      required:
