          description: Descripción de la receta.
          example: Preparación de hamburguesa con piña asada y queso.
        instructions:
          type: string
          description: Instrucciones para preparar la receta.
          example: Cocina la carne, asa la piña y sirve con queso en el pan.
        supplies:
          type: array
          description: Insumos y cantidades que componen la receta.
          items:
            $ref: '#/components/schemas/RecipeSupply'
      example:
        id: 9a6c4d2e-1f3b-48a5-8c7d-6e5f4a3b2c1d
        name: Hamburguesa Hawaiana
        description: Preparación de hamburguesa con piña asada y queso.
        instructions: Cocina la carne, asa la piña y sirve con queso en el pan.
        supplies:
          - inventoryItemId: CARNE-150G
            quantity: 200
            inventoryItem:
              id: CARNE-150G
              name: Carne Molida Res 80/20
              unit: g
    RecipeCreateRequest:
      type: object
      description: Datos requeridos para crear una receta.
      required:
        - name
        - description
        - instructions
        - supplies
      properties:
        name:
          type: string
          description: Nombre de la nueva receta.
          example: Hamburguesa Hawaiana
        description:
          type: string
          description: Descripción de la nueva receta.
          example: Preparación de hamburguesa con piña asada y queso.
        instructions:
          type: string
          description: Instrucciones para preparar la receta.
          example: Cocina la carne, asa la piña y sirve con queso en el pan.
        supplies:
          type: array
          description: Insumos y cantidades utilizados por la receta.
          items:
            $ref: '#/components/schemas/RecipeSupplyInput'
      example:
        name: Hamburguesa Hawaiana
        description: Preparación de hamburguesa con piña asada y queso.
        instructions: Cocina la carne, asa la piña y sirve con queso en el pan.
        supplies:
          - inventoryItemId: CARNE-150G
            quantity: 200
    RecipePatchRequest:
      type: object
      description: Campos de una receta que se desean actualizar.
      properties:
        name:
          type: string
          description: Nuevo nombre de la receta, si se desea cambiar.
          example: Hamburguesa Hawaiana Especial
        description:
          type: string
          description: Nueva descripción de la receta, si se desea cambiar.
          example: Preparación de hamburguesa con piña, queso y salsa de la casa.
        instructions:
          type: string
          description: Nuevas instrucciones de preparación, si se desean cambiar.
          example: Cocina la carne, asa la piña y sirve con queso y salsa en el pan.
        supplies:
          type: array
          description: Insumos y cantidades enviados para actualizar la receta.
          items:
            $ref: '#/components/schemas/RecipeSupplyInput'
    RecipeSupply:
      type: object
      description: Insumo y cantidad que forman parte de una receta.
      required:
        - inventoryItemId
        - quantity
        - inventoryItem
      properties:
        inventoryItemId:
          type: string
          description: Identificador opaco del insumo utilizado, sin formato impuesto.
          example: CARNE-150G
        quantity:
          type: number
          description: Cantidad del insumo expresada en la unidad de inventario.
          example: 200
        inventoryItem:
          $ref: '#/components/schemas/InventoryItem'
      example:
        inventoryItemId: CARNE-150G
        quantity: 200
        inventoryItem:
          id: CARNE-150G
          name: Carne Molida Res 80/20
          unit: g
    RecipeSupplyInput:
      type: object
      description: Insumo y cantidad que se envían al crear o actualizar una receta.
      required:
        - inventoryItemId
        - quantity
      properties:
        inventoryItemId:
          type: string
          description: Identificador opaco del insumo utilizado, sin formato impuesto.
          example: CARNE-150G
        quantity:
          type: number
          description: Cantidad del insumo expresada en la unidad de inventario.
          example: 200
      example:
        inventoryItemId: CARNE-150G
        quantity: 200
    RecipeListResponse:
      type: object
      description: Página de recetas que coincide con la consulta.
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RecipeSummary'
        meta:
          $ref: '#/components/schemas/PageMeta'
    RecipeResponse:
      type: object
      description: Respuesta que contiene una receta.
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/RecipeDetail'
    ImageUploadResponse:
      type: object
      description: Respuesta de una carga de imagen exitosa.
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Image'
    InventoryItemListResponse:
      type: object
      description: Página de insumos de inventario que coincide con la consulta.
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/InventoryItem'
        meta:
          $ref: '#/components/schemas/PageMeta'
    InventoryItemResponse:
      type: object
      description: Respuesta con el artículo de inventario consultado.
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/InventoryItem'
      example:
        data:
          id: CARNE-150G
          name: Carne Molida Res 80/20
          unit: g
    ValidationViolation:
      type: object
      description: Incumplimiento de validación asociado a un campo del cuerpo de la solicitud.
      required:
        - path
        - message
      properties:
        path:
          type: string
          description: Ruta que identifica el campo del cuerpo de la solicitud que no supera la validación.
          example: /name
        message:
          type: string
          description: Explicación de la regla de validación incumplida por el campo.
          example: El nombre es obligatorio.
      example:
        path: /name
        message: El nombre es obligatorio.
    ValidationError:
      description: Error estándar con al menos una infracción de validación en sus detalles.
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required:
            - details
          properties:
            details:
              type: object
              required:
                - violations
              properties:
                violations:
                  type: array
                  minItems: 1
                  description: Infracciones de validación encontradas en el cuerpo de la solicitud.
                  items:
                    $ref: '#/components/schemas/ValidationViolation'
              additionalProperties: true
      example:
        message: El cuerpo de la solicitud contiene campos no válidos.
        details:
          violations:
            - path: /name
              message: El nombre es obligatorio.
    RecipeSlotOptionInput:
      type: object
      description: Datos para crear una opción de slot basada en una receta mediante POST. Se selecciona únicamente por recipeId; el servidor resuelve atómicamente la revisión válida más reciente al asignarla y conserva esa referencia internamente. Las ediciones posteriores de la receta no cambian la opción ni su historia. Una receta inexistente o sin revisión válida devuelve 422 sin aplicar cambios. El servidor genera optionId y asigna status ACTIVE; no se envían optionId ni status en la solicitud.
      additionalProperties: false
      required:
        - sourceType
        - recipeId
        - displayName
      properties:
        sourceType:
          const: RECIPE
          description: Indica que la opción se basa en una receta.
        recipeId:
          type: string
          format: uuid
          description: Identificador UUID de la receta de origen.
          example: 9a6c4d2e-1f3b-48a5-8c7d-6e5f4a3b2c1d
        displayName:
          type: string
          description: Nombre que se mostrará para esta opción en el menú. Puede diferir del nombre de la receta de origen, que se resuelve mediante recipeId.
          example: Hamburguesa hawaiana
      example:
        sourceType: RECIPE
        recipeId: 9a6c4d2e-1f3b-48a5-8c7d-6e5f4a3b2c1d
        displayName: Hamburguesa hawaiana
    InventoryItemSlotOptionInput:
      type: object
      description: Datos para crear una opción de slot basada en un insumo de inventario mediante POST; el servidor genera optionId y asigna status ACTIVE. No se envían optionId ni status en la solicitud.
      additionalProperties: false
      required:
        - sourceType
        - inventoryItemId
        - quantity
        - unit
        - displayName
      properties:
        sourceType:
          const: INVENTORY_ITEM
          description: Indica que la opción se basa directamente en un insumo de inventario.
        inventoryItemId:
          type: string
          description: Identificador opaco del insumo de inventario de origen como string, sin formato impuesto.
          example: CARNE-150G
        quantity:
          type: number
          exclusiveMinimum: 0
          description: Cantidad positiva del artículo.
          example: 150
        unit:
          type: string
          minLength: 1
          description: Unidad compatible con la del artículo.
          example: g
        displayName:
          type: string
          description: Nombre que se mostrará para esta opción en el menú. Puede diferir del nombre del insumo de origen, que se resuelve mediante inventoryItemId.
          example: Queso cheddar
      example:
        sourceType: INVENTORY_ITEM
        inventoryItemId: CARNE-150G
        quantity: 150
        unit: g
        displayName: Queso cheddar
    RecipeSlotOption:
      type: object
      description: Opción de slot cuyo origen es una receta identificada por recipeId. El servidor conserva internamente la revisión resuelta al asignarla; no se expone en la opción. Las respuestas del POST y del PATCH también incluyen su estado.
      additionalProperties: false
      required:
        - optionId
        - sourceType
        - recipeId
        - displayName
      properties:
        optionId:
          type: string
          format: uuid
          description: Identificador UUID de la opción.
          example: a1b2c3d4-e5f6-4789-8abc-def012345678
        sourceType:
          const: RECIPE
          description: Indica que la opción se basa en una receta.
        recipeId:
          type: string
          format: uuid
          description: Identificador UUID de la receta de origen.
          example: 9a6c4d2e-1f3b-48a5-8c7d-6e5f4a3b2c1d
        status:
          $ref: '#/components/schemas/OfferStatus'
          description: Estado de la opción, incluido en las respuestas del POST y del PATCH; al crearla mediante POST el servidor asigna ACTIVE.
        displayName:
          type: string
          description: Nombre que se muestra para esta opción en el catálogo.
          example: Hamburguesa hawaiana
      example:
        optionId: a1b2c3d4-e5f6-4789-8abc-def012345678
        sourceType: RECIPE
        recipeId: 9a6c4d2e-1f3b-48a5-8c7d-6e5f4a3b2c1d
        displayName: Hamburguesa hawaiana
    InventoryItemSlotOption:
      type: object
      description: Opción de slot cuyo origen es un insumo de inventario. La respuesta incluye cantidad y unidad; las respuestas del POST y del PATCH también incluyen su estado.
      additionalProperties: false
      required:
        - optionId
        - sourceType
        - inventoryItemId
        - quantity
        - unit
        - displayName
      properties:
        optionId:
          type: string
          format: uuid
          description: Identificador UUID de la opción.
          example: b2c3d4e5-f678-489a-bcde-f0123456789a
        sourceType:
          const: INVENTORY_ITEM
          description: Indica que la opción se basa directamente en un insumo de inventario.
        inventoryItemId:
          type: string
          description: Identificador opaco del insumo de inventario de origen como string, sin formato impuesto.
          example: CARNE-150G
        quantity:
          type: number
          exclusiveMinimum: 0
          description: Cantidad positiva del artículo.
        unit:
          type: string
          minLength: 1
          description: Unidad compatible con la del artículo.
        status:
          $ref: '#/components/schemas/OfferStatus'
          description: Estado de la opción, incluido en las respuestas del POST y del PATCH; al crearla mediante POST el servidor asigna ACTIVE.
        displayName:
          type: string
          description: Nombre que se muestra para esta opción en el catálogo.
          example: Queso cheddar
      example:
        optionId: b2c3d4e5-f678-489a-bcde-f0123456789a
        sourceType: INVENTORY_ITEM
        inventoryItemId: CARNE-150G
        quantity: 150
        unit: g
        displayName: Queso cheddar
    RecipeSlotOptionPatchInput:
      type: object
      description: Datos para actualizar o crear una opción basada en una receta. Enviar recipeId, incluso si coincide con el actual, asigna atómicamente la revisión válida más reciente de esa receta; el servidor conserva internamente la referencia resuelta. Omitir recipeId en una opción existente de tipo RECIPE conserva su asignación. Cambiar el tipo de origen a RECIPE requiere recipeId. Las ediciones posteriores de la receta no cambian opciones ni historia. Una receta inexistente o sin revisión válida devuelve 422 sin aplicar cambios.
      additionalProperties: false
      required:
        - sourceType
      properties:
        sourceType:
          const: RECIPE
          description: Tipo de origen de esta opción.
        optionId:
          type: string
          format: uuid
          description: Identificador de una opción existente; se omite para crearla.
        displayName:
          type: string
          description: Nombre que se muestra para esta opción.
        status:
          $ref: '#/components/schemas/OfferStatus'
        recipeId:
          type: string
          format: uuid
      allOf:
        - if:
            not:
              required:
                - optionId
          then:
            required:
              - displayName
              - status
              - recipeId
    InventoryItemSlotOptionPatchInput:
      type: object
      description: Datos para actualizar o crear una opción basada en un insumo de inventario.
      additionalProperties: false
      required:
        - sourceType
      properties:
        sourceType:
          const: INVENTORY_ITEM
          description: Tipo de origen de esta opción.
        optionId:
          type: string
          format: uuid
          description: Identificador de una opción existente; se omite para crearla.
        displayName:
          type: string
          description: Nombre que se muestra para esta opción.
        status:
          $ref: '#/components/schemas/OfferStatus'
        inventoryItemId:
          type: string
          description: Identificador opaco del insumo de inventario como string, sin formato impuesto.
          example: CARNE-150G
        quantity:
          type: number
          exclusiveMinimum: 0
        unit:
          type: string
          minLength: 1
      allOf:
        - if:
            not:
              required:
                - optionId
          then:
            required:
              - displayName
              - status
              - inventoryItemId
              - quantity
              - unit
    CatalogOfferPatchRecipeSlotOption:
      allOf:
        - $ref: '#/components/schemas/RecipeSlotOption'
        - type: object
          description: En la respuesta del PATCH siempre se incluye el estado de la opción. La receta se identifica mediante recipeId; la revisión asignada se conserva internamente.
          required:
            - status
          properties:
            status:
              $ref: '#/components/schemas/OfferStatus'
    CatalogOfferPatchInventoryItemSlotOption:
      allOf:
        - $ref: '#/components/schemas/InventoryItemSlotOption'
        - type: object
          description: En la respuesta del PATCH siempre se incluyen el estado de la opción, la cantidad y la unidad del insumo.
          required:
            - status
            - quantity
            - unit
          properties:
            status:
              $ref: '#/components/schemas/OfferStatus'
            quantity:
              type: number
              exclusiveMinimum: 0
            unit:
              type: string
              minLength: 1
    CatalogOfferPatchSlotOption:
      description: Opción de slot devuelta por PATCH con los campos obligatorios de su tipo de origen.
      oneOf:
        - $ref: '#/components/schemas/CatalogOfferPatchRecipeSlotOption'
        - $ref: '#/components/schemas/CatalogOfferPatchInventoryItemSlotOption'
    CatalogOfferPatchCompositionSlot:
      allOf:
        - $ref: '#/components/schemas/CompositionSlot'
        - type: object
          description: La respuesta del PATCH siempre incluye el estado derivado del slot.
          required:
            - status
          properties:
            status:
              $ref: '#/components/schemas/OfferStatus'
            options:
              type: array
              items:
                $ref: '#/components/schemas/CatalogOfferPatchSlotOption'
    CatalogOfferPatchComposition:
      allOf:
        - $ref: '#/components/schemas/Composition'
        - type: object
          properties:
            slots:
              type: array
              items:
                $ref: '#/components/schemas/CatalogOfferPatchCompositionSlot'
    CatalogOfferPatchDetail:
      allOf:
        - $ref: '#/components/schemas/CatalogOfferDetail'
        - type: object
          description: Detalle devuelto por PATCH. Los estados derivados y los datos de origen específicos de cada opción están presentes en todos los slots y opciones.
          properties:
            composition:
              $ref: '#/components/schemas/CatalogOfferPatchComposition'
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: Página solicitada de la colección, numerada desde 1.
      schema:
        type: integer
        minimum: 1
        default: 1
        example: 2
    PageSize:
      name: pageSize
      in: query
      required: false
      description: Número positivo de elementos solicitado por página. Acepta cualquier entero desde 1; si se omite, se usa 12.
      schema:
        type: integer
        minimum: 1
        default: 12
        example: 20
    SearchQuery:
      name: q
      in: query
      required: false
      description: Texto opcional para buscar coincidencias según los campos descritos por la operación.
      schema:
        type: string
        example: hamburguesa
    CategoryFilter:
      name: categoryId
      in: query
      required: false
      description: UUID de categoría o el token reservado para entradas sin categoría.
      example: 7d9c8f30-6c64-4f12-9a1b-6c4a2d5e8f01
      schema:
        anyOf:
          - type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
          - type: string
            const: __uncategorized__
    EntryIdQuery:
      name: entryId
      in: query
      required: false
      description: Identificador UUID de la entrada cuyas ofertas se consultan.
      schema:
        type: string
        format: uuid
        example: 82f7c6d4-3d9a-4fa1-bf2c-7b8d9e0f1a23
    ExcludeOfferId:
      name: excludeOfferId
      in: query
      required: false
      description: Identificador UUID de la oferta que se excluye de los resultados.
      schema:
        type: string
        format: uuid
        example: 4f3b2d1c-9e8a-47b6-85d4-1a2b3c4d5e6f
    EntryStatusQuery:
      name: status
      in: query
      required: false
      description: Estado por el que se filtran las entradas.
      schema:
        $ref: '#/components/schemas/EntryStatus'
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 'ETag fuerte de la versión vigente del recurso leída por el cliente; se envía para una actualización condicional con comparación fuerte. En PATCH /menu/offers/{offerId}, un reintento idempotente conserva el If-Match original: si coincide con una solicitud exitosa vigente, se recupera su respuesta antes de reevaluar ese ETag, aunque ya sea obsoleto. Una ejecución nueva valida el ETag contra la versión vigente normalmente.'
      schema:
        type: string
        example: '"rev-3"'
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: ETag previamente recibido que se compara durante una consulta condicional.
      schema:
        type: string
        example: W/"rev-3"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID generado por el cliente para una operación lógica; se envía sin comillas. Es obligatorio en POST /menu/categories, POST /menu/entries, POST /menu/entries/{entryId}/offers, POST /menu/recipes, POST /media/images y PATCH /menu/offers/{offerId}. Su ausencia o un formato inválido devuelve 400. Los reintentos deben conservar la clave y los datos originales. Para JSON, la comparación ignora espacios y el orden de las propiedades de objetos; conserva el orden de los arrays y distingue un campo omitido de null. En PATCH de ofertas también se compara el If-Match original; el cliente conserva ambos encabezados y el cuerpo, y una respuesta exitosa vigente se recupera antes de reevaluar el ETag. En la carga multipart de imágenes se comparan los bytes exactos del archivo y el tipo de medio declarado de la parte file; se ignoran el boundary, el orden de las partes y el nombre de archivo. La clave se delimita por el sujeto autenticado, el menú provisionado, el método HTTP y la ruta concreta, incluidos entryId u offerId cuando apliquen. El resultado exitoso se conserva durante 24 horas desde la confirmación inicial; los reintentos no extienden ese plazo. Una clave expirada se trata como nueva y puede crear otro recurso o volver a aplicar una actualización; no debe reutilizarse.
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
        example: 83f34a6a-5611-41dd-b437-a9cb96d932c2
  headers:
    ETag:
      description: Validador de la representación devuelta o modificada.
      schema:
        type: string
  responses:
    NotModified:
      description: La representación no cambió desde el ETag indicado.
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
    Unauthorized:
      description: Falta el token de acceso o no es válido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            unauthorized:
              summary: Token de acceso ausente o inválido
              value:
                error:
                  message: Se requiere un token de acceso válido.
    Forbidden:
      description: El token no tiene permiso para la operación.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            forbidden:
              summary: El token no permite la operación
              value:
                error:
                  message: No tienes permiso para realizar esta operación.
    NotFound:
      description: No existe el recurso indicado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            notFound:
              summary: Recurso inexistente
              value:
                error:
                  message: No se encontró el recurso solicitado.
    ResourceInUse:
      description: La receta está referenciada por una o más ofertas.
      content:
        application/json:
          schema:
            type: object
            required:
              - error
            properties:
              error:
                type: object
                required:
                  - message
                  - details
                properties:
                  message:
                    type: string
                    description: Explicación del error para quien consume la API.
                  details:
                    type: object
                    description: Datos específicos del error.
                    required:
                      - offerIds
                    properties:
                      offerIds:
                        type: array
                        description: Identificadores UUID de las ofertas que todavía usan la receta.
                        items:
                          type: string
                          format: uuid
                        example:
                          - 4f3b2d1c-9e8a-47b6-85d4-1a2b3c4d5e6f
                          - 50a4c3d2-8f7e-46b5-94c3-2b1a0f9e8d7c
                    additionalProperties: true
          examples:
            resourceInUse:
              summary: La receta sigue asociada a ofertas
              value:
                error:
                  message: No se puede eliminar la receta mientras una oferta la utilice.
                  details:
                    offerIds:
                      - 4f3b2d1c-9e8a-47b6-85d4-1a2b3c4d5e6f
                      - 50a4c3d2-8f7e-46b5-94c3-2b1a0f9e8d7c
    PreconditionFailed:
      description: El recurso cambió desde que se obtuvo el ETag indicado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            preconditionFailed:
              summary: El ETag ya no corresponde a la versión actual
              value:
                error:
                  message: El recurso cambió desde que fue leído.
    UnprocessableEntity:
      description: La validación de los datos de la solicitud falló; esta respuesta representa errores de validación que impiden procesarla.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorEnvelope'
          examples:
            unprocessableEntity:
              summary: Datos de solicitud no válidos para la operación
              value:
                error:
                  message: Revisa los datos enviados en la solicitud.
                  details:
                    violations:
                      - path: /name
                        message: El nombre es obligatorio.
    TooManyRequests:
      description: Se excedió el límite de solicitudes.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            tooManyRequests:
              summary: Se alcanzó el límite de solicitudes
              value:
                error:
                  message: Espera antes de volver a enviar solicitudes.
    InventoryUnavailable:
      description: 502 cuando Menu no pudo consultar Inventario para validar los artículos o insumos de la operación. No se persiste la creación ni la actualización y no se aplican cambios parciales. Una referencia que se validó como inválida devuelve 422, no 502.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            inventoryUnavailable:
              summary: Inventario no disponible para validar la operación
              value:
                error:
                  message: No se pudo consultar Inventario; no se aplicaron cambios.
    IdempotencyBadRequest:
      description: Falta el encabezado Idempotency-Key obligatorio o su valor no tiene el formato UUID requerido; no se crea ni modifica el recurso.
      content:
        application/json:
          schema:
            type: object
            required:
              - error
            properties:
              error:
                type: object
                required:
                  - message
                  - details
                properties:
                  message:
                    type: string
                  details:
                    type: object
                    required:
                      - code
                    properties:
                      code:
                        type: string
                        enum:
                          - INVALID_IDEMPOTENCY_KEY
          examples:
            invalidIdempotencyKey:
              summary: Clave de idempotencia ausente o inválida
              value:
                error:
                  message: Envía Idempotency-Key con un UUID válido.
                  details:
                    code: INVALID_IDEMPOTENCY_KEY
    IdempotencyConflict:
      description: 'La clave vigente ya está vinculada a datos diferentes de solicitud (IDEMPOTENCY_KEY_REUSED): un JSON semánticamente distinto, un If-Match original distinto en PATCH de ofertas, o bytes de archivo o tipo de medio declarado distintos en la carga de imágenes. Una solicitud con la misma clave y los mismos datos que sigue en proceso o cuyo resultado aún es incierto devuelve IDEMPOTENCY_IN_PROGRESS. Ninguno de estos rechazos inicia otra creación ni actualización; no se ejecuta de nuevo una operación con resultado incierto hasta resolver el resultado anterior. Para IDEMPOTENCY_IN_PROGRESS, espere los segundos indicados en Retry-After y reintente con la misma clave y todos los datos originales, incluido If-Match cuando aplique. Para IDEMPOTENCY_KEY_REUSED, recupere los datos originales para reintentar esa operación o use una clave nueva solo si pretende una operación distinta.'
      headers:
        Retry-After:
          description: Segundos antes de reintentar; solo se devuelve para IDEMPOTENCY_IN_PROGRESS.
          schema:
            type: integer
            minimum: 1
            example: 1
      content:
        application/json:
          schema:
            type: object
            required:
              - error
            properties:
              error:
                type: object
                required:
                  - message
                  - details
                properties:
                  message:
                    type: string
                  details:
                    type: object
                    required:
                      - code
                    properties:
                      code:
                        type: string
                        enum:
                          - IDEMPOTENCY_KEY_REUSED
                          - IDEMPOTENCY_IN_PROGRESS
          examples:
            idempotencyKeyReused:
              summary: La clave ya identifica otros datos de solicitud
              value:
                error:
                  message: La clave de idempotencia ya está vinculada a una solicitud diferente.
                  details:
                    code: IDEMPOTENCY_KEY_REUSED
            idempotencyInProgress:
              summary: La misma operación todavía se está procesando
              value:
                error:
                  message: La solicitud con esta clave de idempotencia sigue en proceso.
                  details:
                    code: IDEMPOTENCY_IN_PROGRESS
