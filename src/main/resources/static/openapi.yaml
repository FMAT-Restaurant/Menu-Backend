    post:
      tags:
        - Recetas
      operationId: createMenuRecipe
      summary: Crear una receta
      description: Crea una receta con sus insumos y cantidades. Cada inventoryItemId debe referirse a un artículo de inventario existente; una referencia inexistente o inválida devuelve 422. Si falla la consulta a Inventario necesaria para validar los insumos, devuelve 502 sin crear la receta ni aplicar cambios parciales. Requiere Idempotency-Key con un UUID generado por el cliente por operación, delimitado por el sujeto autenticado, el menú, el método POST y la ruta concreta. Durante 24 horas desde la confirmación inicial exitosa, reenviar la misma clave y el mismo JSON semántico devuelve el 201, cuerpo, ETag y recipeId originales sin crear otra receta. La comparación ignora espacios y orden de propiedades; conserva el orden de arrays y distingue omisión de null. Cada intento verifica autenticación y autorización antes de recuperar el resultado, que se devuelve antes de revalidar referencias vigentes o volver a consultar Inventario, incluso si la receta fue editada o eliminada después. Un encabezado ausente o inválido devuelve 400 INVALID_IDEMPOTENCY_KEY; otros datos con la misma clave devuelven 409 IDEMPOTENCY_KEY_REUSED. Una operación en curso o con resultado todavía incierto devuelve 409 IDEMPOTENCY_IN_PROGRESS con Retry-After; no inicia otra creación hasta confirmar el resultado anterior. Los fallos confirmados antes de guardar, incluido 502, no aplican cambios ni conservan un resultado exitoso y permiten reintentar la misma clave y datos. Los reintentos no extienden las 24 horas; una clave expirada puede tratarse como nueva y crear un duplicado.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeCreateRequest'
            examples:
              recetaHamburguesa:
                summary: Crear una receta con un insumo
                value:
                  name: Hamburguesa Hawaiana
                  description: Carne, jamón, queso y piña.
                  instructions: Asar carne, dorar jamón y piña. Montar en pan.
                  supplies:
                    - inventoryItemId: CARNE-150G
                      quantity: 200
      responses:
        '201':
          description: Receta creada, o reproducción del 201, cuerpo y ETag originales de la misma operación idempotente.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeResponse'
              examples:
                recetaCreada:
                  summary: Receta creada con sus insumos
                  value:
                    data:
                      id: c4813f65-00b4-4921-874e-03c555796401
                      name: Hamburguesa Hawaiana
                      description: Carne, jamón, queso y piña.
                      instructions: Asar carne, dorar jamón y piña. Montar en pan.
                      supplies:
                        - inventoryItemId: CARNE-150G
                          quantity: 200
                          inventoryItem:
                            id: CARNE-150G
                            name: Carne Molida Res 80/20
                            unit: g
        '400':
          $ref: '#/components/responses/IdempotencyBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/InventoryUnavailable'
