openapi: 3.1.0
info:
  title: API de Menu y referencia externa de Inventario
  version: 5.0.1
  description: 'Contrato HTTP de las operaciones de consulta y administración de Menu, con una referencia a la consulta externa de Inventario para facilitar el trabajo del frontend. El frontend llama directamente al microservicio de Inventario; el backend de Menu no implementa ni atiende /inventory/items. Las operaciones de Menu se organizan por recurso y no definen el host de despliegue; sus rutas son relativas a una URL base que termina en /api/v1. Las imágenes se cargan previamente mediante POST /media/images, que recibe multipart/form-data y devuelve data.id con un identificador generado por el servidor. Los POST y PATCH de entradas y ofertas reciben JSON con imageId: obligatorio al crear y opcional al editar; omitirlo conserva la imagen vigente. Solo la carga de imágenes recibe el archivo mediante multipart/form-data. Las entradas nuevas inician INACTIVE, con estado asignado por el servidor. Las ofertas nuevas también inician INACTIVE y deben activarse manualmente. El PATCH de ofertas conserva los campos omitidos y reemplaza recursivamente los conjuntos de slots y opciones enviados. Valida el resultado completo y persiste atómicamente, con un ETag fuerte vigente en If-Match.'
  license:
    name: MIT
    url: https://github.com/FMAT-Restaurant/Menu-Documentation/blob/main/LICENSE
  contact:
    name: FMAT Restaurant
servers:
  - url: /api/v1
    description: Prefijo de ruta relativo. El despliegue debe proporcionar el host para formar la URL base completa, que termina en /api/v1.
security:
  - bearerAuth: []
tags:
  - name: Categorías
    description: Administración y consulta de categorías del menú.
  - name: Entradas
    description: Administración y consulta de entradas del catálogo.
  - name: Ofertas
    description: Administración de ofertas y sus composiciones.
  - name: Recetas
    description: Administración y consulta de recetas.
  - name: Inventario
    description: Referencia al servicio externo de Inventario; el frontend consulta allí los artículos usados como fuentes de composición, no en el backend Menu.
  - name: Imágenes
    description: Carga de imágenes utilizadas por entradas y ofertas.
paths:
  /menu/categories:
    get:
      tags:
        - Categorías
      operationId: listMenuCategories
      summary: Listar categorías
      description: Devuelve una página de categorías con el número de entradas asociadas. Use page y pageSize para recorrer la lista; If-None-Match permite reutilizar una respuesta que no haya cambiado.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Página de categorías del menú.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'
              examples:
                primeraPagina:
                  summary: Categorías de la primera página
                  value:
                    data:
                      - id: 0ddba9d0-0f45-4abc-9e4a-3e3471a5ce01
                        name: Bebidas
                        description: Bebidas frías y preparadas.
                        entryCount: 4
                    meta:
                      page: 1
                      pageSize: 12
                      total: 1
                      totalPages: 1
        '304':
          $ref: '#/components/responses/NotModified'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags:
        - Categorías
      operationId: createMenuCategory
      summary: Crear una categoría
      description: Crea una categoría para organizar entradas del catálogo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreateRequest'
            examples:
              nuevaCategoria:
                summary: Crear una categoría de postres
                value:
                  name: Postres
                  description: Opciones dulces.
      responses:
        '201':
          description: Categoría creada.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
              examples:
                categoriaCreada:
                  summary: Categoría creada
                  value:
                    data:
                      id: 0ddba9d0-0f45-4abc-9e4a-3e3471a5ce01
                      name: Postres
                      description: Opciones dulces.
                      entryCount: 0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /menu/categories/{categoryId}:
    parameters:
      - name: categoryId
        in: path
        required: true
        description: UUID de la categoría que se consultará o modificará.
        schema:
          type: string
          format: uuid
          example: 0ddba9d0-0f45-4abc-9e4a-3e3471a5ce01
    get:
      tags:
        - Categorías
      operationId: getMenuCategory
      summary: Consultar una categoría
      description: Devuelve la categoría solicitada. La respuesta incluye el ETag fuerte vigente de esta categoría; el cliente puede enviarlo en If-Match al actualizar o eliminar este mismo recurso.
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Categoría solicitada.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
              examples:
                categoria:
                  summary: Categoría consultada
                  value:
                    data:
                      id: 0ddba9d0-0f45-4abc-9e4a-3e3471a5ce01
                      name: Bebidas
                      description: Bebidas frías y preparadas.
                      entryCount: 4
        '304':
          $ref: '#/components/responses/NotModified'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      tags:
        - Categorías
      operationId: patchMenuCategory
      summary: Actualizar una categoría
      description: Actualiza los campos de la categoría indicados en el cuerpo. Envíe el ETag leído en If-Match para evitar sobrescribir cambios recientes.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryPatchRequest'
            examples:
              cambiarDescripcion:
                summary: Actualizar nombre y descripción
                value:
                  name: Postres
                  description: Postres y otras opciones dulces.
      responses:
        '200':
          description: Categoría actualizada.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
              examples:
                categoriaActualizada:
                  summary: Categoría después de la actualización
                  value:
                    data:
                      id: 0ddba9d0-0f45-4abc-9e4a-3e3471a5ce01
                      name: Postres
                      description: Postres y otras opciones dulces.
                      entryCount: 0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags:
        - Categorías
      operationId: deleteMenuCategory
      summary: Eliminar una categoría
      description: Elimina la categoría y quita su UUID de las entradas asociadas. Envíe el ETag leído en If-Match para confirmar que la categoría no cambió.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Categoría eliminada y referencias retiradas.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /menu/entries:
    get:
      tags:
        - Entradas
      operationId: listMenuEntries
      summary: Listar entradas del catálogo
      description: Busca entradas por texto, categoría y estado. La búsqueda considera el nombre, la descripción y los nombres de categoría; los resultados se filtran y paginan en el servidor. Esta consulta administrativa permite recuperar entradas INACTIVE y ARCHIVED mediante los filtros y no excluye entradas por carecer de ofertas publicables. ACTIVE es un estado administrativo; no implica que la entrada sea publicable.
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/CategoryFilter'
        - $ref: '#/components/parameters/EntryStatusQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Página de entradas que coincide con los filtros.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogEntryListResponse'
              examples:
                entradasActivas:
                  summary: Entradas activas de la primera página
                  value:
                    data:
                      - id: 7d19a8ce-402c-4bab-b383-9969b69fe101
                        brandName: Hamburguesa Hawaiana
                        description: Carne, jamón, queso y piña en pan artesanal.
                        status: ACTIVE
                        image:
                          id: 55e62412-9249-4db6-8ccb-31f19ea2f501
                          url: https://cdn.example.com/menu/hamburguesa-hawaiana.jpg
                          thumbnailUrl: https://cdn.example.com/menu/hamburguesa-hawaiana-thumb.jpg
                        categories:
                          - id: 0ddba9d0-0f45-4abc-9e4a-3e3471a5ce01
                            name: Hamburguesas
                        offerCount: 2
                    meta:
                      page: 1
                      pageSize: 12
                      total: 1
                      totalPages: 1
        '304':
          $ref: '#/components/responses/NotModified'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags:
        - Entradas
      operationId: createMenuEntry
      summary: Crear una entrada
      description: Crea una entrada del catálogo con sus categorías y una imagen obligatoria previamente cargada en POST /api/v1/media/images. Envíe data.id de esa respuesta como imageId en el cuerpo JSON; esta operación no recibe el archivo ni asigna un nuevo identificador de imagen. El backend asigna el estado INACTIVE; el cliente no proporciona status. imageId debe identificar una imagen existente, válida y accesible al solicitante. Los metadatos y las asociaciones de imagen y categorías se validan y persisten de forma atómica. La entrada y sus categorías pertenecen al menú provisionado en la instalación. Una referencia de imagen inválida, categorías inexistentes o de otro menú y cualquier solicitud inválida devuelven 422 sin crear la entrada ni aplicar cambios. La carga previa de imagen es una operación independiente y no se deshace si falla la creación de la entrada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogEntryCreateRequest'
            examples:
              hamburguesaHawaiana:
                summary: Crear una entrada inactiva con imagen
                value:
                  brandName: Hamburguesa Hawaiana
                  description: Carne, jamón, queso y piña en pan artesanal.
                  categoryIds:
                    - 0ddba9d0-0f45-4abc-9e4a-3e3471a5ce01
                  imageId: 55e62412-9249-4db6-8ccb-31f19ea2f501
      responses:
        '201':
          description: Entrada creada en INACTIVE y asociada con la imagen previamente cargada.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogEntryResponse'
              examples:
                entradaCreada:
                  summary: Entrada creada
                  value:
                    data:
                      id: 7d19a8ce-402c-4bab-b383-9969b69fe101
                      brandName: Hamburguesa Hawaiana
                      description: Carne, jamón, queso y piña en pan artesanal.
                      status: INACTIVE
                      image:
                        id: 55e62412-9249-4db6-8ccb-31f19ea2f501
                        url: https://cdn.example.com/menu/hamburguesa-hawaiana.jpg
                        thumbnailUrl: https://cdn.example.com/menu/hamburguesa-hawaiana-thumb.jpg
                      categoryIds:
                        - 0ddba9d0-0f45-4abc-9e4a-3e3471a5ce01
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /menu/entries/{entryId}:
    parameters:
      - name: entryId
        in: path
        required: true
        description: UUID de la entrada del catálogo.
        schema:
          type: string
          format: uuid
          example: 7d19a8ce-402c-4bab-b383-9969b69fe101
    get:
      tags:
        - Entradas
      operationId: getMenuEntry
      summary: Consultar una entrada
      description: Devuelve el detalle de una entrada, incluidos los UUID de sus categorías y los datos de la imagen asociada.
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Detalle de la entrada.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogEntryResponse'
              examples:
                detalleEntrada:
                  summary: Detalle de una entrada
                  value:
                    data:
                      id: 7d19a8ce-402c-4bab-b383-9969b69fe101
                      brandName: Hamburguesa Hawaiana
                      description: Carne, jamón, queso y piña en pan artesanal.
                      status: ACTIVE
                      image:
                        id: 55e62412-9249-4db6-8ccb-31f19ea2f501
                        url: https://cdn.example.com/menu/hamburguesa-hawaiana.jpg
                        thumbnailUrl: https://cdn.example.com/menu/hamburguesa-hawaiana-thumb.jpg
                      categoryIds:
                        - 0ddba9d0-0f45-4abc-9e4a-3e3471a5ce01
        '304':
          $ref: '#/components/responses/NotModified'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      tags:
        - Entradas
      operationId: patchMenuEntry
      summary: Actualizar una entrada
      description: 'Actualiza los campos enviados; los omitidos conservan sus valores. Enviar categoryIds reemplaza el conjunto completo de categorías. La entrada y sus categorías deben pertenecer al menú provisionado en la instalación. Se permite activar o inactivar la entrada, pasar de ACTIVE o INACTIVE a ARCHIVED y desarchivar de ARCHIVED a INACTIVE. El paso directo de ARCHIVED a ACTIVE devuelve 422. Estas transiciones no alteran los estados de las ofertas. Para reemplazar la imagen, envíe imageId en el cuerpo JSON con data.id de la respuesta de POST /api/v1/media/images para una imagen previamente cargada y validada. Debe existir y ser accesible al solicitante; una referencia inválida devuelve 422. Omitir imageId conserva la imagen vigente; null se rechaza. Esta operación no recibe archivos ni URLs. La validación y persistencia de metadatos y asociaciones de imagen y categorías es atómica; un error no aplica cambios parciales y conserva la imagen vigente. La carga previa es una operación independiente y no se deshace si falla la actualización. Envíe el ETag leído en If-Match: su ausencia devuelve 428 y un valor obsoleto devuelve 412, sin modificaciones.'
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogEntryPatchRequest'
            examples:
              actualizarEntrada:
                summary: Cambiar el estado de una entrada
                value:
                  status: ACTIVE
              reemplazarImagen:
                summary: Reemplazar únicamente la imagen de una entrada
                value:
                  imageId: 55e62412-9249-4db6-8ccb-31f19ea2f501
      responses:
        '200':
          description: Entrada actualizada.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogEntryResponse'
              examples:
                entradaActualizada:
                  summary: Entrada después de la actualización
                  value:
                    data:
                      id: 7d19a8ce-402c-4bab-b383-9969b69fe101
                      brandName: Hamburguesa Hawaiana
                      description: Carne, jamón, queso y piña en pan artesanal.
                      status: ACTIVE
                      image:
                        id: 55e62412-9249-4db6-8ccb-31f19ea2f501
                        url: https://cdn.example.com/menu/hamburguesa-hawaiana.jpg
                        thumbnailUrl: https://cdn.example.com/menu/hamburguesa-hawaiana-thumb.jpg
                      categoryIds:
                        - 0ddba9d0-0f45-4abc-9e4a-3e3471a5ce01
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          description: Se requiere el encabezado If-Match para actualizar la entrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                faltaIfMatch:
                  summary: Encabezado de concurrencia ausente
                  value:
                    error:
                      message: El encabezado If-Match es requerido.
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags:
        - Entradas
      operationId: deleteMenuEntry
      summary: Eliminar una entrada
      description: Elimina la entrada y también las ofertas asociadas. Envíe el ETag leído en If-Match para confirmar que la entrada no cambió.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Entrada y ofertas asociadas eliminadas.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /menu/offers:
    get:
      tags:
        - Ofertas
      operationId: listMenuOffers
      summary: Listar ofertas
      description: Devuelve una página de ofertas. Puede limitar los resultados a una entrada y excluir una oferta concreta; la lista se pagina en el servidor.
      parameters:
        - $ref: '#/components/parameters/EntryIdQuery'
        - $ref: '#/components/parameters/ExcludeOfferId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Página de ofertas.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogOfferListResponse'
              examples:
                ofertasDeEntrada:
                  summary: Ofertas de una entrada del catálogo
                  value:
                    data:
                      - id: b57f7e2a-02a4-4fb7-bb41-55f2d974b101
                        entryId: 7d19a8ce-402c-4bab-b383-9969b69fe101
                        entryName: Hamburguesa Hawaiana
                        presentationTag: Individual
                        basePrice: 180
                        status: ACTIVE
                        image:
                          id: 8c3f4365-1d1d-4a85-969a-c6c80757b201
                          url: https://cdn.example.com/menu/hamburguesa-individual.jpg
                          thumbnailUrl: https://cdn.example.com/menu/hamburguesa-individual-thumb.jpg
                        slotCount: 1
                    meta:
                      page: 1
                      pageSize: 12
                      total: 1
                      totalPages: 1
        '304':
          $ref: '#/components/responses/NotModified'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /menu/entries/{entryId}/offers:
    parameters:
      - name: entryId
        in: path
        required: true
        description: UUID de la entrada a la que pertenecerá la nueva oferta.
        schema:
          type: string
          format: uuid
          example: 7d19a8ce-402c-4bab-b383-9969b69fe101
    post:
      tags:
        - Ofertas
      operationId: createEntryOffer
      summary: Crear una oferta para una entrada
      description: 'Crea una oferta asociada a la entrada indicada en la ruta. La composición define los espacios de selección y sus opciones. La imagen es obligatoria: cárguela antes mediante POST /api/v1/media/images y envíe data.id de la respuesta como imageId en el cuerpo JSON. Esta operación no recibe archivos ni URLs. imageId debe identificar una imagen existente, válida y accesible al solicitante; una referencia inválida devuelve 422 sin crear la oferta. Toda oferta se crea con estado INACTIVE y debe activarse manualmente después. La carga previa es una operación independiente y no se deshace si falla la creación de la oferta.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogOfferCreateRequest'
            examples:
              ofertaConReceta:
                summary: Crear una oferta con una opción de receta
                value:
                  presentationTag: Individual
                  basePrice: 185
                  imageId: 8c3f4365-1d1d-4a85-969a-c6c80757b201
                  composition:
                    slots:
                      - name: Plato principal
                        quantity: 1
                        course: plato fuerte
                        options:
                          - sourceType: RECIPE
                            recipeId: c4813f65-00b4-4921-874e-03c555796401
                            recipeRevision: 2
                            displayName: Hamburguesa Hawaiana
              ofertaConInventario:
                summary: Crear una oferta con una opción de insumo de inventario
                value:
                  presentationTag: Individual
                  basePrice: 180
                  imageId: 8c3f4365-1d1d-4a85-969a-c6c80757b201
                  composition:
                    slots:
                      - name: Acompañamiento
                        quantity: 1
                        course: plato fuerte
                        options:
                          - sourceType: INVENTORY_ITEM
                            inventoryItemId: INV-potatoes-001
                            quantity: 200
                            unit: g
                            displayName: Papas
      responses:
        '201':
          description: Oferta creada.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CatalogOfferResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/CatalogOfferDetail'
                          - type: object
                            properties:
                              status:
                                type: string
                                const: INACTIVE
              examples:
                ofertaCreadaConReceta:
