# Spring Framework 7 pausa los contextos cacheados que no se usan y, al reanudarlos, arranca todos sus
# Lifecycle sin respetar spring.rabbitmq.listener.simple.auto-startup=false. Eso conectaria los @RabbitListener
# a un broker que no existe en las pruebas sin RabbitMQ, asi que los contextos cacheados no se pausan.
spring.test.context.cache.pause=never
